[project]
name = "eventgraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.156.4",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pymysql>=1.2.3",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs MySQL/PostgreSQL/Spark"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["eventgraph"]
