services:
  pg:
    image: postgres:16
    container_name: eventgraph-pg
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: eventgraph
      POSTGRES_PASSWORD: eventgraph
      POSTGRES_DB: eventgraph
    volumes: ["eventgraph-pg:/var/lib/postgresql/data"]
volumes:
  eventgraph-pg:
